  </head><body class="bg-surface text-on-surface antialiased pt-safe pb-safe min-h-screen flex flex-col"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin py-space-md">
<!-- Centered Branding Group -->
<header class="flex flex-col items-center text-center mt-space-sm mb-space-lg">
<!-- App Logo Icon -->
<div class="w-14 h-14 rounded-full bg-secondary-container flex items-center justify-center shadow-sm mb-space-sm transform transition-transform hover:scale-105 duration-300">
<span class="font-display-currency text-primary text-headline-md font-bold leading-none select-none">₹</span>
</div>
<!-- App Name -->
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight mb-1">
      Kanakkan
    </h1>
<!-- Tagline -->
<p class="font-body-md text-body-md text-on-surface-variant font-normal">
      Your money, kept simple.
    </p>
</header>
<!-- Main Card Container -->
<section class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-6 mb-space-lg">
<div class="mb-space-md">
<h2 class="font-title-lg text-title-lg text-on-surface tracking-tight mb-1">Create account</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Track, organize, and safeguard your finances effortlessly.</p>
</div>
<form class="flex flex-col gap-y-4" novalidate="" onsubmit="event.preventDefault();">
<!-- 1. Full Name Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="full-name">
          Full Name
        </label>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input autocomplete="name" class="w-full h-12 pl-11 pr-4 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-inner" id="full-name" name="name" placeholder="Chandru M" type="text"/>
</div>
</div>
<!-- 2. Email Address Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="email-address">
          Email address
        </label>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-12 pl-11 pr-4 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-inner" id="email-address" name="email" placeholder="chandru@example.com" type="email"/>
</div>
</div>
<!-- 3. Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="password">
          Password
        </label>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="new-password" class="w-full h-12 pl-11 pr-12 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-inner" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-1 w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-on-surface rounded-lg transition-colors cursor-pointer" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- 4. Confirm Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="confirm-password">
          Confirm password
        </label>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock_reset</span>
</div>
<input autocomplete="new-password" class="w-full h-12 pl-11 pr-12 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-inner" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-1 w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-on-surface rounded-lg transition-colors cursor-pointer" id="toggle-confirm-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="confirm-password-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<div class="pt-2">
<button class="w-full h-12 bg-primary hover:bg-secondary text-on-primary font-label-lg text-label-lg font-medium rounded-xl shadow-sm flex items-center justify-center transition-all active:scale-[0.99] cursor-pointer" type="submit">
          Create account
        </button>
</div>
<!-- Subtle Tonal Divider -->
<div class="relative flex items-center justify-center my-1">
<div class="w-full h-px bg-surface-variant"></div>
<span class="absolute bg-surface-container-lowest px-3 font-label-sm text-label-sm text-outline uppercase tracking-wider">
          or
        </span>
</div>
<!-- Secondary OAuth Button: Continue with Google -->
<button class="w-full h-12 bg-surface-container-low hover:bg-surface-container text-on-surface font-label-lg text-label-lg font-medium rounded-xl flex items-center justify-center gap-3 transition-colors active:scale-[0.99] cursor-pointer" type="button">
<svg aria-hidden="true" class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- Sign In Switcher Prompt -->
<div class="flex items-center justify-center gap-1.5 pt-1 text-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">
          Already have an account?
        </span>
<button class="font-label-lg text-label-lg text-primary hover:text-secondary font-medium transition-colors cursor-pointer py-1 px-1 focus:outline-none" type="button">
          Sign in
        </button>
</div>
</form>
</section>
<!-- Clean Minimal Footer -->
<footer class="w-full text-center pb-space-sm mt-auto">
<p class="font-label-sm text-label-sm text-outline tracking-wider">
      Kanakkan v1.0.0
    </p>
</footer>
</div>
<script>
  // Password visibility toggle logic
  function setupPasswordToggle(buttonId, inputId, iconId) {
    const button = document.getElementById(buttonId);
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);

    if (button && input && icon) {
      button.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        icon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  }

  setupPasswordToggle('toggle-password', 'password', 'password-eye-icon');
  setupPasswordToggle('toggle-confirm-password', 'confirm-password', 'confirm-password-eye-icon');
</script></main></body></html>
