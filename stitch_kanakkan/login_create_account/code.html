<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-fixed-variant": "#653e00", "surface-container-lowest": "#ffffff", "surface": "#f9f9ff", "surface-tint": "#006a63", "tertiary-fixed-dim": "#ffb95f", "on-primary-fixed": "#00201d", "on-surface": "#141b2b", "on-error-container": "#93000a", "on-primary-container": "#a3faef", "primary": "#005c55", "on-secondary-fixed-variant": "#005049", "inverse-on-surface": "#edf0ff", "on-tertiary-container": "#ffe6cc", "surface-container-high": "#e1e8fd", "outline": "#6e7977", "tertiary-container": "#945d00", "secondary-fixed-dim": "#6bd8cb", "on-error": "#ffffff", "error-container": "#ffdad6", "inverse-primary": "#80d5cb", "on-primary": "#ffffff", "surface-container": "#e9edff", "error": "#ba1a1a", "surface-variant": "#dce2f7", "on-background": "#141b2b", "surface-bright": "#f9f9ff", "primary-fixed-dim": "#80d5cb", "on-tertiary": "#ffffff", "tertiary-fixed": "#ffddb8", "inverse-surface": "#293040", "surface-container-highest": "#dce2f7", "secondary-fixed": "#89f5e7", "secondary-container": "#86f2e4", "on-tertiary-fixed": "#2a1700", "secondary": "#006a61", "on-secondary": "#ffffff", "outline-variant": "#bdc9c6", "background": "#f9f9ff", "on-surface-variant": "#3e4947", "surface-container-low": "#f1f3ff", "on-secondary-fixed": "#00201d", "primary-fixed": "#9cf2e8", "surface-dim": "#d3daef", "primary-container": "#0f766e", "on-primary-fixed-variant": "#00504a", "on-secondary-container": "#006f66", "tertiary": "#734700" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xs": "0.25rem", "space-xl": "2rem", "gutter": "1rem", "space-md": "1rem", "space-lg": "1.5rem", "margin": "1rem", "space-sm": "0.5rem" }, "fontFamily": { "title-md": ["Inter"], "title-lg": ["Inter"], "display-currency": ["Inter"], "body-lg": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"], "headline-lg-mobile": ["Inter"], "body-sm": ["Inter"], "display-currency-mobile": ["Inter"], "label-sm": ["Inter"], "label-md": ["Inter"], "label-lg": ["Inter"] }, "fontSize": { "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "display-currency": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "display-currency-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "500" }] } } } };</script><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior-y:none;font-family:'Inter',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface text-on-surface min-h-screen flex flex-col pt-safe pb-safe selection:bg-secondary-container selection:text-on-secondary-container"><main class="flex-1 flex flex-col items-center justify-center min-h-screen relative w-full bg-surface px-margin py-8"><div class="flex flex-col w-full max-w-sm my-auto items-center">
<div class="flex flex-col items-center text-center pt-4 pb-2 px-margin"><div class="w-16 h-16 rounded-2xl bg-secondary-container/60 flex items-center justify-center shadow-sm mb-4"><div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-on-primary shadow-sm"><span class="font-headline-md text-headline-md font-bold tracking-tight">₹</span></div></div><h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight mb-2">Kanakkan</h1><p class="font-body-md text-body-md text-on-surface-variant mb-8">Your money, kept simple.</p></div>
<div class="w-full bg-surface-container-lowest rounded-3xl p-6 shadow-sm">

<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<div class="hidden flex-col gap-1.5 transition-all" id="field-name">
<label class="font-label-md text-label-md text-on-surface font-medium" for="input-name">Full name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">person</span>
<input class="w-full h-12 pl-11 pr-4 rounded-xl bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="input-name" placeholder="e.g. Arun Kumar" type="text">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="input-email">Email address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full h-12 pl-11 pr-4 rounded-xl bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="input-email" placeholder="name@example.com" type="email">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="input-password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full h-12 pl-11 pr-12 rounded-xl bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="input-password" placeholder="Enter your password" type="password">
<button aria-label="Toggle password visibility" class="absolute right-2.5 w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface transition-colors rounded-lg" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end -mt-1" id="forgot-password-wrap">
<button class="font-label-md text-label-md text-primary font-medium hover:underline" type="button">
          Forgot password?
        </button>
</div>
<button class="w-full h-12 mt-4 rounded-xl bg-primary text-on-primary font-title-md text-title-md flex items-center justify-center gap-2 shadow-sm active:scale-[0.99] transition-transform" id="submit-button" type="submit">
<span id="submit-text" class="">Sign in</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="relative flex items-center justify-center my-2">
<div class="w-full h-[1px] bg-surface-container-highest"></div>
<span class="absolute bg-surface-container-lowest px-3 font-label-sm text-label-sm text-outline uppercase tracking-wider">or</span>
</div>
<button class="w-full h-12 rounded-xl bg-surface-container-lowest text-on-surface font-title-md text-title-md flex items-center justify-center gap-3 shadow-sm hover:bg-surface-container-low active:scale-[0.99] transition-all" type="button">
<svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.665-5.17 3.665-9.12z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.13C3.28 21.43 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.13z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.28 2.57 1.25 6.58l4.03 3.13c.95-2.83 3.6-4.96 6.72-4.96z" fill="#EA4335"></path>
</svg>
<span class="">Continue with Google</span>
</button>
<div class="text-center mt-2">
<p class="font-body-md text-body-md text-on-surface-variant" id="toggle-prompt">
          New here? 
          <button class="text-primary font-title-md text-body-md font-semibold hover:underline ml-1" onclick="switchAuthTab('signup')" type="button">
            Create account
          </button>
</p>
</div>
</form>
</div>

</div><p class="text-xs text-outline font-body-sm text-center pt-6 pb-2">Kanakkan v1.0.0</p>
<script>
  function switchAuthTab(mode) {
    const tabSignin = document.getElementById('tab-signin');
    const tabSignup = document.getElementById('tab-signup');
    const fieldName = document.getElementById('field-name');
    const forgotWrap = document.getElementById('forgot-password-wrap');
    const submitText = document.getElementById('submit-text');
    const togglePrompt = document.getElementById('toggle-prompt');

    if (mode === 'signup') {
      tabSignup.className = "flex-1 py-2.5 rounded-xl font-label-lg text-label-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5";
      tabSignin.className = "flex-1 py-2.5 rounded-xl font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5";
      fieldName.classList.remove('hidden');
      fieldName.classList.add('flex');
      forgotWrap.classList.add('hidden');
      submitText.textContent = "Create account";
      togglePrompt.innerHTML = 'Already have an account? <button type="button" onclick="switchAuthTab(\'signin\')" class="text-primary font-title-md text-body-md font-semibold hover:underline ml-1">Sign in</button>';
    } else {
      tabSignin.className = "flex-1 py-2.5 rounded-xl font-label-lg text-label-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5";
      tabSignup.className = "flex-1 py-2.5 rounded-xl font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5";
      fieldName.classList.add('hidden');
      fieldName.classList.remove('flex');
      forgotWrap.classList.remove('hidden');
      submitText.textContent = "Sign in";
      togglePrompt.innerHTML = 'New here? <button type="button" onclick="switchAuthTab(\'signup\')" class="text-primary font-title-md text-body-md font-semibold hover:underline ml-1">Create account</button>';
    }
  }

  function togglePasswordVisibility() {
    const input = document.getElementById('input-password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main>

</body></html>
