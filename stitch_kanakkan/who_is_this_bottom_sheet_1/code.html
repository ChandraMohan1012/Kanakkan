<script>
    (function initWhatForSheet() {
      // Category grid selection
      const categoryChips = document.querySelectorAll('input[name="spend_category"]');
      categoryChips.forEach(radio => {
        radio.addEventListener('change', () => {
          categoryChips.forEach(r => {
            const label = r.closest('.category-chip');
            const icon = label.querySelector('.material-symbols-outlined');
            const text = label.querySelector('span:not(.material-symbols-outlined)');
            
            label.className = 'category-chip flex flex-col items-center justify-center p-2 rounded-xl border border-surface-container-high bg-surface-container-low text-on-surface hover:bg-surface-container cursor-pointer transition-all text-center';
            icon.className = 'material-symbols-outlined text-[20px] text-on-surface-variant mb-0.5';
            text.className = 'text-xs font-medium leading-tight';
          });

          const currentLabel = radio.closest('.category-chip');
          const currentIcon = currentLabel.querySelector('.material-symbols-outlined');
          const currentText = currentLabel.querySelector('span:not(.material-symbols-outlined)');

          currentLabel.className = 'category-chip flex flex-col items-center justify-center p-2 rounded-xl border border-[#0F766E] bg-[#0F766E] text-white cursor-pointer shadow-sm transition-all text-center';
          currentIcon.className = 'material-symbols-outlined text-[20px] mb-0.5';
          currentText.className = 'text-xs font-semibold leading-tight';
        });
      });

      // Need / Want Toggle
      const toggleButtons = document.querySelectorAll('#need-want-toggle .toggle-btn');
      toggleButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          toggleButtons.forEach(b => {
            b.className = 'toggle-btn py-2 text-xs font-medium rounded-lg text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5 transition-all';
            const icon = b.querySelector('.material-symbols-outlined');
            if (icon) icon.remove();
          });
          btn.className = 'toggle-btn py-2 text-xs font-semibold rounded-lg bg-surface-container-lowest text-[#0F766E] shadow-sm flex items-center justify-center gap-1.5 transition-all';
          const icon = document.createElement('span');
          icon.className = 'material-symbols-outlined text-[16px]';
          icon.textContent = 'check_circle';
          btn.prepend(icon);
        });
      });

      // Save Button Feedback
      const saveBtn = document.getElementById('save-btn');
      if (saveBtn) {
        saveBtn.addEventListener('click', () => {
          saveBtn.innerHTML = `
            <span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
            <span>Saving...</span>
          `;
          setTimeout(() => {
            saveBtn.innerHTML = `
              <span class="material-symbols-outlined text-[18px]">check</span>
              <span>Saved</span>
            `;
            saveBtn.classList.replace('bg-[#0F766E]', 'bg-secondary');
          }, 500);
        });
      }
    })();
  </script>
