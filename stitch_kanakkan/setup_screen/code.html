  </head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go Back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><span class="text-title-lg font-bold text-primary-container tracking-tight">Kanakkan</span></div><div class="flex items-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Introductory Banner -->
<div class="pt-space-md pb-space-sm flex flex-col gap-space-xs"><p class="text-label-lg font-semibold text-primary tracking-wide uppercase">Salary Setup</p>

<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface tracking-tight">
      Let's set up your cycle
    </h2>
<p class="text-body-md font-body-md text-on-surface-variant">
      Takes less than a minute. You can edit this anytime.
    </p>
</div>
<form class="flex flex-col gap-space-lg mt-space-sm" id="onboarding-form" onsubmit="event.preventDefault();">
<!-- Section 1: Monthly Salary Amount -->
<section class="flex flex-col gap-space-xs">
<label class="text-title-md font-title-md text-on-surface flex items-center justify-between" for="salary-input">
<span class="">Monthly salary amount</span>
<span class="text-label-sm font-label-sm text-primary font-semibold">Net Take-Home</span>
</label>
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-xs transition-all duration-200 focus-within:ring-2 focus-within:ring-primary/20">
<div class="flex items-baseline gap-1">
<span class="text-headline-md font-headline-md text-primary font-bold">₹</span>
<input aria-describedby="salary-helper" class="w-full bg-transparent text-display-currency-mobile font-display-currency-mobile text-on-surface tracking-tight outline-none border-none p-0 focus:outline-none" id="salary-input" inputmode="numeric" placeholder="1,00,000" type="text" value="45,000">
</div>
<p class="text-body-sm font-body-sm text-outline flex items-center gap-1" id="salary-helper">
<span class="material-symbols-outlined text-[15px] text-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
          Net take-home amount after taxes &amp; deductions
        </p>
</div>
</section>
<!-- Section 2: Expected Next Salary Date -->
<section class="flex flex-col gap-space-xs">
<label class="text-title-md font-title-md text-on-surface">
        Expected next salary date
      </label>
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-md">
<!-- Interactive Date Picker Trigger -->
<button class="w-full flex items-center justify-between py-1 text-left active:opacity-80 transition-opacity" id="date-picker-button" type="button">
<div class="flex items-center gap-space-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container/40 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]">calendar_today</span>
</div>
<div class="flex flex-col">
<span class="text-title-md font-title-md text-on-surface" id="selected-date-text">01 November 2026</span>
<span class="text-label-sm font-label-sm text-outline">Upcoming credit day</span>
</div>
</div>
<span class="inline-flex items-center px-2.5 py-1 rounded-full text-label-sm font-label-sm bg-secondary-container text-on-secondary-container font-semibold">
            In 18 days
          </span>
</button>
<!-- Quick selection chips -->
<div class="flex items-center gap-2 overflow-x-auto pb-0.5 no-scrollbar">
<button class="chip-option px-3 py-1.5 rounded-full text-label-md font-label-md bg-primary text-on-primary transition-colors flex items-center gap-1 shrink-0" data-date="01 November 2026" type="button">
<span class="">1st of month</span>
<span class="material-symbols-outlined text-[14px]">check</span>
</button>
<button class="chip-option px-3 py-1.5 rounded-full text-label-md font-label-md bg-surface-container-high text-on-surface hover:bg-surface-variant transition-colors shrink-0" data-date="31 October 2024" type="button">
            Last working day
          </button>
<button class="chip-option px-3 py-1.5 rounded-full text-label-md font-label-md bg-surface-container-high text-on-surface hover:bg-surface-variant transition-colors shrink-0" data-date="25 October 2024" type="button">
            25th of month
          </button>
</div>
</div>
</section>
<!-- Section 3: Your First Savings Goal -->
<section class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="text-title-md font-title-md text-on-surface">
          Your first savings goal
        </label>
<span class="inline-flex items-center gap-1 text-label-sm font-label-sm text-tertiary-container font-semibold bg-tertiary-fixed/60 px-2 py-0.5 rounded-full">
<span class="material-symbols-outlined text-[13px]">stars</span>
          Smart start
        </span>
</div>
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-md">
<!-- Goal Name -->
<div class="flex flex-col gap-1">
<label class="text-label-md font-label-md text-on-surface-variant" for="goal-name">Goal name</label>
<div class="flex items-center gap-2 bg-surface-container-low rounded-lg px-3 py-2.5">
<span class="material-symbols-outlined text-outline text-[18px]">savings</span>
<input class="w-full bg-transparent text-body-md font-body-md text-on-surface outline-none border-none p-0 focus:outline-none placeholder:text-outline" id="goal-name" placeholder="e.g. Goa Trip, New iPad, Emergency Fund" type="text" value="Emergency Fund">
</div>
</div>
<!-- Target Amount and Optional Date (2-column layout on mobile) -->
<div class="grid grid-cols-2 gap-space-sm">
<div class="flex flex-col gap-1">
<label class="text-label-md font-label-md text-on-surface-variant" for="goal-amount">Target amount</label>
<div class="flex items-center gap-1 bg-surface-container-low rounded-lg px-3 py-2.5">
<span class="text-body-md font-body-md text-primary font-bold">₹</span>
<input class="w-full bg-transparent text-body-md font-body-md text-on-surface font-semibold outline-none border-none p-0 focus:outline-none" id="goal-amount" inputmode="numeric" type="text" value="50,000">
</div>
</div>
<div class="flex flex-col gap-1">
<label class="text-label-md font-label-md text-on-surface-variant" for="goal-date">Target date</label>
<div class="flex items-center gap-1.5 bg-surface-container-low rounded-lg px-3 py-2.5">
<span class="material-symbols-outlined text-outline text-[18px]">event</span>
<input class="w-full bg-transparent text-body-md font-body-md text-on-surface outline-none border-none p-0 focus:outline-none" id="goal-date" placeholder="Optional" type="text" value="14 Mar 2027">
</div>
</div>
</div>
</div>
</section>
<!-- Delight micro-card / reassurance badge -->
<div class="flex items-center gap-space-sm p-space-sm rounded-lg bg-surface-container-high/40">
<div class="w-8 h-8 rounded-full bg-secondary-container/50 flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined text-[18px]">insights</span>
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant">
        We'll track your daily safe-to-spend balance based on your cycle pace.
      </p>
</div>
<!-- CTA Button -->
<div class="pt-space-xs">
<button class="w-full h-[52px] bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md active:scale-[0.99] transition-transform duration-150" id="submit-btn" type="button">
<span class="">Start tracking</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<script>
  // Quick date chips interaction
  const chips = document.querySelectorAll('.chip-option');
  const dateDisplay = document.getElementById('selected-date-text');

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => {
        c.className = 'chip-option px-3 py-1.5 rounded-full text-label-md font-label-md bg-surface-container-high text-on-surface hover:bg-surface-variant transition-colors shrink-0';
        const checkIcon = c.querySelector('.material-symbols-outlined');
        if (checkIcon) checkIcon.remove();
      });

      chip.className = 'chip-option px-3 py-1.5 rounded-full text-label-md font-label-md bg-primary text-on-primary transition-colors flex items-center gap-1 shrink-0';
      
      const check = document.createElement('span');
      check.className = 'material-symbols-outlined text-[14px]';
      check.innerText = 'check';
      chip.appendChild(check);

      if (dateDisplay && chip.dataset.date) {
        dateDisplay.innerText = chip.dataset.date;
      }
    });
  });

  // Simple Indian number formatting on input blur
  const salaryInput = document.getElementById('salary-input');
  if (salaryInput) {
    salaryInput.addEventListener('blur', (e) => {
      let val = e.target.value.replace(/[^0-9]/g, '');
      if (val) {
        let num = parseInt(val, 10);
        e.target.value = num.toLocaleString('en-IN');
      }
    });
  }

  const goalAmount = document.getElementById('goal-amount');
  if (goalAmount) {
    goalAmount.addEventListener('blur', (e) => {
      let val = e.target.value.replace(/[^0-9]/g, '');
      if (val) {
        let num = parseInt(val, 10);
        e.target.value = num.toLocaleString('en-IN');
      }
    });
  }
</script></main>







</body></html>
